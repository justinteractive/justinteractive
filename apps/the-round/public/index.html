<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Round</title>
<meta name="theme-color" content="#1E2A44" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="app">

  <!-- ============ Calendar (root) screen ============ -->
  <section id="calendarScreen" class="screen">
    <header class="topbar">
      <div class="topbar-row">
        <span class="app-name">The Round</span>
        <button type="button" class="icon-btn" id="manageDogsBtn" aria-label="Manage dogs">🐾</button>
      </div>
      <div class="week-nav">
        <button type="button" class="icon-btn" id="prevWeekBtn" aria-label="Previous week">‹</button>
        <button type="button" class="week-label" id="weekLabel">This week</button>
        <button type="button" class="icon-btn" id="nextWeekBtn" aria-label="Next week">›</button>
      </div>
    </header>

    <main id="agendaList" class="agenda-list"></main>

    <button type="button" id="newRunFab" class="fab" aria-label="New run">+</button>
  </section>

  <!-- ============ Run detail screen ============ -->
  <section id="runScreen" class="screen" hidden>
    <header class="topbar">
      <div class="topbar-row">
        <button type="button" class="icon-btn" id="runBackBtn" aria-label="Back to calendar">←</button>
        <button type="button" class="kebab-btn kebab-btn--light" id="runKebabBtn" data-action="kebab-run" aria-label="Run options">⋮</button>
      </div>
      <div class="run-heading">
        <input type="text" id="runTitleInput" class="run-title-input" />
        <input type="date" id="runDateInput" class="run-date-input" />
      </div>
    </header>

    <main id="runMain" class="run-main">
      <ol id="runStopsList" class="dog-list route-list"></ol>
      <p id="runEmptyState" class="empty-state" hidden>No dogs added yet.</p>
      <div class="run-actions">
        <button type="button" id="addDogsBtn" class="secondary-btn" style="width:100%;">+ Add dogs</button>
      </div>
    </main>
  </section>

  <!-- ============ Add dogs to run screen ============ -->
  <section id="addDogsScreen" class="screen" hidden>
    <header class="topbar">
      <div class="topbar-row">
        <button type="button" class="icon-btn" id="addDogsBackBtn" aria-label="Done">← Done</button>
        <span class="screen-title" id="addDogsRunTitle">Add dogs</span>
      </div>
      <div class="search-row search-row--dark">
        <input type="search" id="addDogsSearch" placeholder="Search name, address or postcode…" autocomplete="off" />
      </div>
    </header>
    <main class="agenda-list">
      <ul id="pickerDogList" class="dog-list"></ul>
    </main>
  </section>

  <!-- ============ Manage dogs (global) screen ============ -->
  <section id="manageDogsScreen" class="screen" hidden>
    <header class="topbar">
      <div class="topbar-row">
        <button type="button" class="icon-btn" id="manageDogsBackBtn" aria-label="Back to calendar">←</button>
        <span class="screen-title">All dogs</span>
      </div>
      <div class="search-row search-row--dark">
        <input type="search" id="manageDogsSearch" placeholder="Search name, address or postcode…" autocomplete="off" />
      </div>
    </header>
    <main class="agenda-list">
      <ul id="manageDogList" class="dog-list"></ul>
    </main>
    <button type="button" id="addDogFab" class="fab" aria-label="Add dog">+</button>
  </section>

  <!-- Kebab context menu (anchored dynamically) -->
  <div id="contextMenu" class="context-menu" hidden></div>

  <!-- New run sheet -->
  <div id="newRunOverlay" class="overlay" hidden>
    <div class="sheet" id="newRunSheet" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Dog detail sheet -->
  <div id="detailOverlay" class="overlay" hidden>
    <div class="sheet" id="detailSheet" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Add dog sheet -->
  <div id="addOverlay" class="overlay" hidden>
    <div class="sheet" id="addSheet" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

</div>

<script src="app.js"></script>
</body>
</html>
