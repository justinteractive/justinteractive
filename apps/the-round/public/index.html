<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Round</title>
<meta name="theme-color" content="#1E2A44" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="app">

  <!-- Top bar: app name, AM/PM toggle, tab chips -->
  <header class="topbar">
    <div class="topbar-row">
      <span class="app-name">The Round</span>
      <div class="mode-toggle" role="group" aria-label="Route mode">
        <button type="button" class="mode-btn" data-mode="am">Collect</button>
        <button type="button" class="mode-btn" data-mode="pm">Return</button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" class="tab-chip" data-tab="all" role="tab">All dogs</button>
      <button type="button" class="tab-chip" data-tab="route" role="tab">
        Today's route <span class="route-count" id="routeCount">0</span>
      </button>
    </div>
  </header>

  <main id="mainContent">

    <!-- ============ All dogs tab ============ -->
    <section id="allDogsTab" class="tab-panel">
      <div class="search-row">
        <input type="search" id="searchInput" placeholder="Search name, address or postcode…" autocomplete="off" />
        <button type="button" id="selectToggleBtn" class="text-btn">Select</button>
      </div>
      <ul id="dogList" class="dog-list"></ul>
    </section>

    <!-- ============ Today's route tab ============ -->
    <section id="routeTab" class="tab-panel" hidden>
      <div class="route-actions">
        <button type="button" id="sortNearbyBtn" class="chip-btn">Sort by nearby</button>
        <button type="button" id="openMapsBtn" class="chip-btn">Open in Maps</button>
        <button type="button" id="flipModeBtn" class="chip-btn">Flip to PM</button>
      </div>
      <p class="hint-text">
        "Sort by nearby" clusters stops by postcode-district centroid — a
        rough geographic grouping, not live traffic routing.
      </p>
      <p class="hint-text" id="mapsLimitHint" hidden></p>
      <ol id="routeList" class="dog-list route-list"></ol>
      <p id="routeEmptyState" class="empty-state" hidden>
        No stops yet. Add dogs from the All dogs tab.
      </p>
    </section>

  </main>

  <!-- Sticky select-mode bar (All dogs tab) -->
  <div id="selectBar" class="sticky-bar" hidden>
    <span id="selectCount">0 selected</span>
    <div class="sticky-bar-actions">
      <button type="button" id="selectCancelBtn" class="text-btn">Cancel</button>
      <button type="button" id="selectAddBtn" class="primary-btn">Add to route</button>
    </div>
  </div>

  <!-- Sticky save bar (Today's route tab) -->
  <div id="saveBar" class="sticky-bar" hidden>
    <span id="saveStatus">Not saved yet</span>
    <button type="button" id="saveRouteBtn" class="primary-btn">Save route</button>
  </div>

  <!-- Floating add-dog button -->
  <button type="button" id="addDogFab" class="fab" aria-label="Add dog" hidden>+</button>

  <!-- Kebab context menu (anchored dynamically) -->
  <div id="contextMenu" class="context-menu" hidden></div>

  <!-- Dog detail sheet -->
  <div id="detailOverlay" class="overlay" hidden>
    <div class="sheet" id="detailSheet" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Add dog sheet -->
  <div id="addOverlay" class="overlay" hidden>
    <div class="sheet" id="addSheet" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

</div>

<script src="app.js"></script>
</body>
</html>
